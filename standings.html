<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Standings — De La Rosa Masters</title>
<link rel="stylesheet" href="app.css" />
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
<body>
<div id="header-host"></div>
<main>
  <section id="standings" class="panel active">
    <div class="grid">
      <div class="card span12">
        <div class="actions" style="justify-content:space-between">
          <div>
            <h2 style="margin-bottom:4px">Standings</h2>
            <div id="standingsSubtitle" class="muted"></div>
          </div>
          <div class="actions">
            <button class="btn-secondary" id="viewTeamBtn">Team Standings</button>
            <button class="btn-secondary" id="viewPlayerBtn">Player Standings</button>
          </div>
        </div>
        <div id="standingsContent" style="margin-top:12px"></div>
      </div>
    </div>
  </section>
  <footer>Data is stored locally in browser storage. De La Rosa Masters • Ilusión Bowl Edition</footer>
</main>

<script src="app.js"></script>
<script>
(function(){
  const { getState, esc, teamTotals, playerOrder } = App;
  let view = 'team';

  function calculateTeamStandings(){
    const state=getState();
    const map=App.teamMap();
    const stats=state.teams.map(t=>({id:t.id,name:t.name,shift:t.shift||1,points:0,pinfall:0,highest:0,games:0}));
    const sm=Object.fromEntries(stats.map(s=>[s.id,s]));
    for(const g of state.games){
      for(const m of g.matches){
        if(!m.completed) continue;
        const A=map[m.aId], B=map[m.bId], sa=sm[m.aId], sb=sm[m.bId];
        if(!sa||!sb) continue;
        let ap=0, bp=0;
        m.bowlers.forEach((o,pos)=>{
          const aa=o.a+A.bowlers[pos].handicap, bb=o.b+B.bowlers[pos].handicap;
          if(aa>bb)ap+=2; else if(aa<bb)bp+=2; else {ap+=1;bp+=1;}
          sa.pinfall+=o.a; sb.pinfall+=o.b;
        });
        sa.highest=Math.max(sa.highest,m.teamScoreA); sb.highest=Math.max(sb.highest,m.teamScoreB);
        const ha=m.teamScoreA+teamTotals(A).hdcp, hb=m.teamScoreB+teamTotals(B).hdcp;
        if(ha>hb)ap+=4; else if(ha<hb)bp+=4; else {ap+=2;bp+=2;}
        sa.points+=ap; sb.points+=bp; sa.games++; sb.games++;
      }
    }
    return stats.sort((a,b)=>b.points-a.points||b.pinfall-a.pinfall||b.highest-a.highest||a.name.localeCompare(b.name));
  }

  function calculatePlayerStandings(){
    const state=getState();
    const map=App.teamMap(), players=[];
    state.teams.forEach(t=>t.bowlers.forEach(b=>players.push({
      id: t.id+'|'+b.name, name: b.name, team: t.name, gender: b.gender,
      handicap: b.handicap, points:0, pinfall:0, highest:0, games:0, gameScores:{}
    })));
    const sm=Object.fromEntries(players.map(p=>[p.id,p]));
    for(const g of state.games) for(const m of g.matches){
      if(!m.completed) continue;
      const A=map[m.aId], B=map[m.bId];
      if(!A||!B) continue;
      m.bowlers.forEach((o,pos)=>{
        const pa=sm[m.aId+'|'+A.bowlers[pos].name], pb=sm[m.bId+'|'+B.bowlers[pos].name];
        if(pa){
          const aa=o.a+A.bowlers[pos].handicap, bb=o.b+B.bowlers[pos].handicap;
          pa.points += aa>bb?2:aa===bb?1:0;
          pa.pinfall+=o.a; pa.highest=Math.max(pa.highest,o.a); pa.games++;
          pa.gameScores[g.number]=o.a;
        }
        if(pb){
          const aa=o.a+A.bowlers[pos].handicap, bb=o.b+B.bowlers[pos].handicap;
          pb.points += bb>aa?2:bb===aa?1:0;
          pb.pinfall+=o.b; pb.highest=Math.max(pb.highest,o.b); pb.games++;
          pb.gameScores[g.number]=o.b;
        }
      });
    }
    return players.sort((a,b)=>b.points-a.points||b.pinfall-a.pinfall||b.highest-a.highest||a.name.localeCompare(b.name));
  }

  function renderTeamStandings(){
    const state=getState();
    document.getElementById('standingsSubtitle').textContent = state.started ? 'Displaying all teams across all shifts.' : 'Tournament not started.';
    if(!state.teams.length){
      document.getElementById('standingsContent').innerHTML='<div class="empty">No registered teams.</div>';
      return;
    }
    const t=calculateTeamStandings();
    const latestCompleted=state.games.filter(g=>g.matches.every(m=>m.completed)).length;
    document.getElementById('standingsContent').innerHTML=`
      <div class="kpis"><div class="kpi"><div class="small">Total Teams</div><div class="big">${state.teams.length}</div></div><div class="kpi"><div class="small">Completed games</div><div class="big">${latestCompleted}</div></div><div class="kpi"><div class="small">Points leader</div><div class="big">${t[0]?.points??0}</div></div><div class="kpi"><div class="small">Top pinfall</div><div class="big">${t[0]?.pinfall??0}</div></div></div>
      <div style="overflow-x:auto"><table><thead><tr><th>Pos</th><th>Team</th><th>Shift</th><th>Points</th><th>Pinfall</th><th>Highest Game</th><th>Games</th></tr></thead><tbody>${t.map((x,i)=>`<tr><td><b>${i+1}</b></td><td>${esc(x.name)}</td><td>Shift ${x.shift}</td><td><b>${x.points}</b></td><td>${x.pinfall}</td><td>${x.highest}</td><td>${x.games}</td></tr>`).join('')}</tbody></table></div>
      <p class="small muted" style="margin-top:10px">Standings combine all shifts automatically.</p>`;
  }

  function renderPlayerStandings(){
    const state=getState();
    if(!state.teams.length){
      document.getElementById('standingsContent').innerHTML='<div class="empty">No registered teams.</div>';
      return;
    }
    const groups=[['Male','Men'],['Female','Women'],['Male Senior','Senior Men'],['Female Senior','Senior Women']];
    const p=calculatePlayerStandings();
    const totalGamesCount = state.games.length;

    document.getElementById('standingsContent').innerHTML=groups.map(([g,label])=>{
      const rows=p.filter(x=>x.gender===g);
      const gameHeaders = Array.from({length: totalGamesCount}, (_, i)=>`<th>G${i+1}</th>`).join('');
      return `<div class="card" style="box-shadow:none;margin-bottom:12px">
        <h3>${label}</h3>
        ${rows.length ? `
          <div style="overflow-x:auto"><table><thead><tr><th>Pos</th><th>Player</th><th>Team</th>${gameHeaders}<th>Points</th><th>Total HDCP</th><th>Pinfall</th><th>Highest Game</th></tr></thead><tbody>
            ${rows.map((x,i)=>{
              const gameCells = Array.from({length: totalGamesCount}, (_, gIdx)=>{
                const gNum=gIdx+1, sc=x.gameScores[gNum];
                return `<td>${sc!==undefined?sc:'—'}</td>`;
              }).join('');
              const totalHdcp = x.games * x.handicap;
              return `<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.team)}</td>${gameCells}<td><b>${x.points}</b></td><td>${totalHdcp}</td><td>${x.pinfall}</td><td>${x.highest}</td></tr>`;
            }).join('')}
          </tbody></table></div>
        ` : '<div class="empty">No players in this category.</div>'}
      </div>`;
    }).join('');
  }

  function renderAll(){
    document.getElementById('standingsSubtitle').textContent = getState().started ? 'Displaying all teams and bowlers across all shifts.' : 'Tournament not started.';
    if(view==='team') renderTeamStandings(); else renderPlayerStandings();
    App.updateHeaderStatus();
  }

  /* ---------- Boot ---------- */
  App.mountPage('standings');
  document.getElementById('viewTeamBtn').onclick = ()=>{ view='team'; renderAll(); };
  document.getElementById('viewPlayerBtn').onclick = ()=>{ view='player'; renderAll(); };
  window.onAuthSuccess = renderAll;
  window.onStateSaved = renderAll;
  renderAll();
})();
</script>
</body>
</html>
