<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Management</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Load Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Destructure useState from the global React object instead of importing
        const { useState } = React;

        function GameManagement() {
          const [matches, setMatches] = useState([]);

          const handleRandomize = () => {
            console.log("Randomizing matches...");
            // Logic to shuffle and pair teams
          };

          const handleSaveAll = () => {
            console.log("Saving all matches to database:", matches);
          };

          return (
            <div className="relative min-h-screen pb-24 bg-gray-50">
              <div className="p-6 max-w-4xl mx-auto">
                <h2 className="text-2xl font-bold mb-6">Current Game Matches</h2>
                
                <div className="space-y-4 mb-8">
                  {matches.map((match, index) => (
                    <div key={index} className="p-4 bg-white shadow rounded-lg flex justify-between">
                      <span>{match.teamA} vs {match.teamB}</span>
                    </div>
                  ))}
                </div>

                {matches.length > 0 && (
                  <div className="flex justify-center mt-8">
                    <button 
                      onClick={handleSaveAll}
                      className="px-8 py-3 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 w-full md:w-auto"
                    >
                      Save All Matches
                    </button>
                  </div>
                )}
              </div>

              <button
                onClick={handleRandomize}
                className="fixed bottom-6 right-6 h-16 w-16 bg-green-500 text-white rounded-full shadow-xl flex items-center justify-center hover:bg-green-600 hover:scale-105 transition-transform z-50 text-xs font-bold"
                title="Randomize"
              >
                Shuffle
              </button>
            </div>
          );
        }

        // Render the component to the root div
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GameManagement />);
    </script>
</body>
</html>
